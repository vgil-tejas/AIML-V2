server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Declare the encoding on the wire. Without it the deck (which is served as its
    # own document) falls back to a legacy encoding when opened outside the iframe,
    # and every em-dash and middot renders as mojibake.
    charset utf-8;

    # Gzip — compress HTML/JS/CSS before sending to the proxy
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 500;
    gzip_types text/html text/css application/javascript application/json text/plain;

    # Service worker — must be served with no-cache so browsers always get updates
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # CSS — must revalidate, same as HTML. The two ship as one unit: HTML was
    # no-cache while CSS sat on max-age=3600, so every CSS change created up to
    # an hour of new-markup + old-stylesheet skew (the "where is the CSS"
    # unstyled-page bug). ETag makes revalidation a cheap 304 on a LAN.
    location ~* \.css$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Images/fonts — safe to cache; they don't pair with markup versions
    location ~* \.(png|jpg|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=600";
        try_files $uri =404;
    }

    # HTML — never serve a stale app shell or deck. These files carry all the app
    # logic; a cached copy silently ships old code (an old Overview deck kept
    # answering with a removed code path until this was set). Revalidate always.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SSO landing page: the SIEM redirects to /auth/sso (no extension). Map that
    # exact path to the real file. no-cache so an updated flow is never stale.
    location = /auth/sso {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /auth/sso.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
