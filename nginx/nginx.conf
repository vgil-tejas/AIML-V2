events { worker_connections 2048; }

http {
    # ── Gzip: compress API JSON + static assets before sending over network ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types
        application/json
        application/javascript
        text/css
        text/html
        text/plain
        text/javascript;

    # ── Docker embedded DNS ────────────────────────────────────────────────
    # CRITICAL: resolver + VARIABLE upstreams (set $x ...; proxy_pass http://$x).
    # Using a variable forces nginx to re-resolve the container IP on each
    # request via Docker DNS. Static `upstream { server backend:8000; }` blocks
    # resolve ONCE at startup, so after `docker compose up --build backend` the
    # container gets a new IP and nginx keeps hitting the dead old one -> 502.
    # This is the documented recurring-502 fix — do not switch back to upstream{}.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    log_format soc '$remote_addr $status "$request" '
                   'upstream=$upstream_addr code=$upstream_status '
                   'rt=${request_time}s urt=${upstream_response_time}s';
    access_log /var/log/nginx/access.log soc;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        # Emit RELATIVE redirects (Location: /login.html, not http://host/login.html).
        # nginx listens on container port 80 but is published on 19888, so an
        # absolute redirect would drop the real port and 404. Relative keeps it.
        absolute_redirect off;

        set $frontend   "frontend:80";
        set $backend    "backend:8000";
        set $ml         "ml-engine:8001";
        set $clickhouse "clickhouse:8123";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout              10s;
        proxy_send_timeout                 600s;
        client_max_body_size               500M;

        # ══════════════════════════════════════════════════════════════════
        #  LOGIN GATE (single operator — see backend/auth.py)
        #  Every gated location runs `auth_request /_authcheck`, an internal
        #  subrequest to the backend's /api/auth/verify. 200 -> allowed;
        #  401 -> the browser is bounced to /login.html (for pages) or gets a
        #  plain 401 (for /api and /ch XHR calls). This is server-enforced:
        #  the dashboard cannot be reached without a valid session cookie.
        #  NOTE: internal service-to-service calls (watcher->backend, etc.) do
        #  NOT pass through nginx — they use the Docker network directly — so
        #  this gate never blocks ingestion or automation.
        # ══════════════════════════════════════════════════════════════════

        # Internal auth check. Forwards only the cookie (no body) to the backend.
        location = /_authcheck {
            internal;
            proxy_pass http://$backend/api/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }
        # Where unauthenticated PAGE requests get sent.
        location @login { return 302 /login.html; }

        # ── ALWAYS-OPEN paths (no gate) ───────────────────────────────────
        # The login page itself, the auth endpoints, and health checks must be
        # reachable before login (and by the installer / deploy health gate).
        location = /login.html   { proxy_pass http://$frontend; }
        # /sw.js MUST be open so the browser can always fetch the (retired)
        # service worker to replace a stale one — otherwise an old cached SW
        # keeps serving the old dashboard and never sees the login gate.
        location = /sw.js        { proxy_pass http://$frontend; add_header Cache-Control "no-cache"; }
        location = /api/health   { proxy_pass http://$backend;  proxy_read_timeout 30s; }
        location /health/        { proxy_pass http://$backend;  proxy_read_timeout 30s; }
        location /api/auth/      { proxy_pass http://$backend;  proxy_read_timeout 30s; }

        # ── ClickHouse HTTP proxy (GATED — exposes raw SQL) ───────────────
        location /ch/ {
            auth_request /_authcheck;
            proxy_pass http://$clickhouse/;
            proxy_read_timeout 120s;
        }

        # ── API → ml-engine (GATED; variable upstream re-resolved per req) ──
        location /api/ml/ {
            auth_request /_authcheck;
            proxy_pass http://$ml;
            proxy_read_timeout 600s;
        }

        # ── API → backend (GATED) ─────────────────────────────────────────
        location /api/ {
            auth_request /_authcheck;
            proxy_pass http://$backend;
            proxy_read_timeout 600s;
        }

        # ── Static frontend (GATED; unauth pages redirect to /login.html) ──
        location / {
            auth_request /_authcheck;
            error_page 401 403 = @login;
            proxy_pass http://$frontend;
        }
    }
}
